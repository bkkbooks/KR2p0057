body:
  text: 今夫鬼神有所明有所不明則以其賞善罰暴也昔者堯舜禹湯仁義聖智天下法之此以貴為天子富有天下長年有譽後世述之則鬼神之賞此明矣及桀紂幽厲焚聖人殺諫者賊百姓亂邦家此以桀折於鬲山而紂首於岐社身不沒為天下笑則鬼神之罰此明矣及伍子胥者天下之聖人也鴟夷而死榮夷公者天下之亂人也長年而沒如以此詰之則善者或不賞而暴者或不罰故吾因加鬼神不明則必有故
  hash: sha256:8ef6dbdc540de1b2504b80d62743b512254f70b2ac950fb6f5228d31d1d3b44a
